<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipboard Palette</title>
    <script>
      // 初回描画の前にテーマを確定させ、ちらつきを防ぐ。
      // --theme の値は Tauri の initialization_script で注入される
      // (src-tauri/src/lib.rs)。ブラウザで直接開いた場合は undefined になる。
      const forcedTheme = window.__CLIPBOARD_PALETTE_THEME__;
      const isDark =
        forcedTheme === "dark" ||
        (forcedTheme !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
