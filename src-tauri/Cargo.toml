[package]
name = "clipboard-palette"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
# Not published to crates.io. This also keeps cargo-about from listing the app
# itself (about.toml: [private] ignore)
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_palette_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-cli = "2.4.1"

# Used only to print an exit line when the process is stopped by a signal
# (src/lifecycle.rs). Already in the tree as a transitive dependency
[target.'cfg(unix)'.dependencies]
libc = "0.2"

