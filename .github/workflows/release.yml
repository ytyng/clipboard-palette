name: Release

# Releases follow the version in src-tauri/tauri.conf.json: change it on main and
# the release happens. A push whose version is already released does nothing
# (while an unreleased version sits on main, a push of a fix releases that
# version). `npm run release -- [patch|minor|major]` (scripts/release.sh) bumps
# it and pushes.
#
# What decides whether to release is not the diff -- squash, rebase and a direct
# push each leave a different one -- but whether that version has been released
# already. Asking that makes the workflow idempotent: run again over a released
# version and nothing happens; run again over a failed one and it carries on.
# There is no path filter for the same reason: a bump that lands in an unexpected
# shape is still picked up.
on:
  push:
    branches: [main]
  # A pull request runs the `test` job alone (`plan` and everything after it are
  # held back by `if`). The gate runs on the way in from the same definition, so
  # what a PR checks and what a release checks cannot drift apart.
  pull_request:
  # For a version that is right but whose run failed for a reason since fixed and
  # not yet pushed. The same check applies, so this cannot republish anything.
  workflow_dispatch:

# No permissions by default; each job asks for what it needs. `test` runs code a
# pull request brought in, so it gets contents: read and nothing more (on a PR
# from a branch of this repository GITHUB_TOKEN could otherwise hold write).
#
# Running on pull_request does not let a PR rewrite this workflow to run a job
# with contents: write. On a public repository a pull_request from a fork gets a
# read-only GITHUB_TOKEN and no secrets whatever the permissions say; a PR from a
# branch of this repository can only be opened by someone who already has write.
permissions: {}

# Releases are serialised: one push is one version, and a cancelled run would
# leave its version unreleased with the bump already on main. Both settings are
# needed for that:
#   cancel-in-progress: false -- a later run never cancels the one in progress.
#   queue: max -- up to 100 pending runs are kept. The default `queue: single`
#     keeps one pending run and cancels it when the next arrives, so three pushes
#     in a row would drop the middle version.
# (queue: max cannot be combined with cancel-in-progress: true.)
#
# A pull request's run has nothing to do with that serialisation, so it is kept
# out of the release group: in the same group one PR would push a release into
# pending (and, with cancel-in-progress: false, keep it waiting). It is also
# keyed per commit so that PRs are not serialised among themselves either; a
# burst of pushes to one PR would otherwise queue the newest commit behind the
# checks of the older ones (cancel-in-progress cannot be true for PRs only here).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # Answers one question before any macOS runner is spent: is this version
  # released already? Skipped on pull requests, where the question is moot; that
  # skips build and publish with it (they `need` this job and do not use
  # always()), so a PR runs test alone.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      # A dispatch names its own ref, and a branch carrying an unreleased version
      # would otherwise be built and published from wherever it sits. Releases come
      # from main; a push cannot be anything else, but a dispatch can.
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::releases come from main, and this run is on ${REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version out of src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this version still needs releasing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This endpoint answers for published releases only -- a draft has no tag
          # for it to find -- which is the question being asked here. A draft left
          # by a failed run is filled in again by re-running the same version.
          #
          # Only 404 counts as "not released". A rate limit or an outage read that
          # way would build the version again and the publish job would publish it
          # a second time.
          status=$(gh api "repos/${GH_REPO}/releases/tags/v${VERSION}" \
            --silent --include 2>/dev/null | head -n 1 | awk '{print $2}' || true)
          case "$status" in
            404)
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Releasing v${VERSION}"
              ;;
            200)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "v${VERSION} is already released; nothing to do."
              ;;
            *)
              echo "::error::could not tell whether v${VERSION} exists (HTTP ${status:-none}). Not guessing."
              exit 1
              ;;
          esac

  # The gate in front of a release build.
  # Policy: cyberneura/cyberneura-github-actions, docs/build-requires-tests.md
  #
  # Runs on macOS like the build does (rule 4 of the policy): the signal handlers
  # in lifecycle.rs and the output format of ps differ by OS, and the artifact is
  # only ever built for macOS.
  test:
    # On a push or dispatch it runs only when there is a version to release.
    # Running it unconditionally would spend a macOS runner on every push to main
    # that releases nothing, which is what `plan` exists to avoid. On a pull
    # request `plan` is skipped, which by default would skip this job too, so
    # !cancelled() lifts that and the event name decides (a failed plan still
    # stops it through needs.plan.result).
    needs: plan
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'pull_request'
              || (needs.plan.result == 'success'
                  && needs.plan.outputs.release == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Not a build, so the two universal targets are not needed; the host target
      # is tested.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # build.rs runs under cargo test too, and tauri-build fails before it reaches
      # the app's code unless frontendDist (../build) exists, so the front end is
      # built first.
      - name: Build frontend
        run: npm run build

      - name: Type-check frontend
        run: npm run check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    # Not without the tests. `needs` only reaches jobs in the same run, which is
    # why the tests are not a workflow of their own.
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # A universal (Intel + Apple Silicon) binary shipped as a dmg. Signed with
          # a Developer ID and notarized in the steps below. A local build stays
          # ad-hoc through signingIdentity "-" in tauri.conf.json; in CI
          # APPLE_SIGNING_IDENTITY overrides it (tauri-cli precedence: env > config).
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # --config empties beforeBuildCommand so the front-end build is kept
            # out of `tauri build` (see "Build frontend" below, which also says why
            # the JSON cannot be given inline in args).
            args: --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.ci.conf.json
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      # persist-credentials: false keeps the write-capable GITHUB_TOKEN out of
      # .git/config, where a later step (npm ci's install scripts, a third-party
      # action) could pick it up.
      # Every `uses:` is pinned to a commit SHA because this job handles the Apple
      # certificate: pinning tauri-action alone would not do, since a compromised
      # earlier step could reach it just the same. To update, look up the SHA of
      # the tag named in the trailing comment.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Pin a SHA from master, not from a generated branch like `stable` or
      # `1.89.0`: those commits are collected once the branch moves on, and the
      # run then fails before Rust is even installed (see "Choice of full-length
      # commit SHA" in the action's README). With a master SHA the toolchain cannot
      # be inferred from the ref, so it is named explicitly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # The front end is built in this step, which holds no secrets. Letting
      # `tauri build` run beforeBuildCommand (npm run build) would run vite and
      # its dependency tree in an environment carrying APPLE_PASSWORD and
      # GITHUB_TOKEN (child processes inherit the environment); a single
      # malicious dependency could take the Apple app-specific password and a
      # write-capable token. The signing build uses src-tauri/tauri.ci.conf.json
      # to empty beforeBuildCommand, so nothing is built twice.
      # The override is not given inline as `--config {"build":{...}}` because
      # tauri-action parses args with string-argv and strips the quotes, which
      # breaks the JSON. A file path without quotes is unaffected.
      - name: Build frontend (without secrets)
        run: npm run build

      # With any one of the signing secrets missing, tauri-action would receive an
      # empty string and the build would still pass (ad-hoc signed, not notarized).
      # The publish job only looks at success, so that would ship as though it
      # were signed and notarized. Failing here keeps an undistributable dmg from
      # being published.
      - name: Check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # macOS only: import the Developer ID certificate into a throwaway keychain.
      # tauri-action does not import certificates itself, so this has to happen
      # before the build. The keychain password is single-use, so it is generated
      # here rather than stored as a secret.
      - name: Import Apple Developer certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # codesign looks identities up in the search list rather than in the
          # default keychain, so the new keychain is added to it explicitly instead
          # of relying on the runner image's defaults.
          security list-keychains -d user -s build.keychain
          # Confirm the Developer ID is reachable through the search list and fail
          # right here if not. find-identity exits 0 even with nothing to show, so
          # calling it is not a check; grep is.
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "Error: no 'Developer ID Application' identity in the keychain search list" >&2
            exit 1
          }
          rm "$RUNNER_TEMP/certificate.p12"

      # Creates the v<version> Release from the version in tauri.conf.json and
      # uploads the build. It is created as a draft and published by the publish
      # job once every leg has succeeded, so that adding a Windows leg to the
      # matrix later cannot publish a half-built release. A draft left by a failed
      # run is reused by the re-run of the same version (tauri-action finds it by
      # tag_name in the release list).
      # With the APPLE_* variables set, tauri-action signs with the Developer ID,
      # notarizes and staples on its own. It is pinned to a commit SHA rather than
      # the movable @v0 tag because it receives the Apple credentials: a moved tag
      # would be enough to take them (supply-chain attack).
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple credentials go to the macOS job only (never to another platform).
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # Call the tauri CLI directly instead of going through the "tauri" script
          # in package.json: an inline assignment there such as
          # `APPLE_SIGNING_IDENTITY='...' tauri` would override the env passed in
          # by the workflow.
          # `npm exec -- tauri` cannot be used: tauri-action's runner.ts always
          # inserts `run` after a bin named `npm`, producing `npm run exec ...`,
          # which fails with "Missing script: exec" (observed on v0.1.1). `npx`
          # gets no such insertion.
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: clipboard-palette v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishes the draft only once every platform has built and uploaded. If any
  # leg fails the draft stays a draft: an incomplete release is never published.
  # The Homebrew cask (ytyng/homebrew-tap) is not touched here: the tap's own
  # workflow looks up the latest published release every hour and rewrites it.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --draft=false --latest
