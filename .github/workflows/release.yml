name: Release

# リリースは手動実行 (workflow_dispatch) のみ。push では自動ビルドしない。
# ローカルからは `npm run release -- [patch|minor|major]` で起動する (scripts/release.sh)。
# PR では test ジョブだけが走る (build 以降は if で止めてある)。門番のテストを
# マージ前に同じ定義で回すためで、リリース経路とテストの内容がずれない。
on:
  workflow_dispatch:
  pull_request:

# 既定は権限なし。必要な job にだけ与える。特に test は PR が持ち込んだコードを
# 実行するので contents: read までしか渡さない (同一リポジトリからの PR では
# GITHUB_TOKEN が write を持ちうるため、ここを既定に任せない)。
#
# この workflow は pull_request でも起動するが、「PR で workflow 自体を書き換えれば
# contents: write のジョブを動かせる」ことにはならない。public リポジトリの fork から
# の pull_request では、permissions の記述に関わらず GITHUB_TOKEN が read-only に
# 切り下げられ secrets も渡らない (write token を渡す設定があるのは private リポジトリ
# 側の話で、ここには無い)。同一リポジトリのブランチから PR を出せるのは既に write
# 権限を持つ相手だけなので、そちらも権限の昇格にはならない。
permissions: {}

# 同時に走らないよう直列化する。1 回の dispatch が 1 つの version に対応するため、
# キャンセルされた run の version は (bump コミットは main に載ったまま) 永久に
# 公開されない状態になる。それを防ぐために 2 つとも要る:
#   cancel-in-progress: false — 走行中の run を後発でキャンセルしない。
#   queue: max — pending も最大 100 件まで積む。既定の `queue: single` は
#     「pending は 1 件だけ。新しく queue されたら既存の pending をキャンセルして
#     置き換える」なので、3 回連続で dispatch すると真ん中の version が消える。
# (queue: max と cancel-in-progress: true の併用は validation error になる)
#
# PR の検査 run は「1 dispatch = 1 version」の直列化とは無関係なので、リリース用の
# グループへ入れない。同じグループにすると PR が 1 本走るだけでリリースが pending に
# 積まれる (cancel-in-progress: false なので待たされ続ける)。さらに commit ごとに
# 別グループにして、PR 側では直列化そのものを効かせない — ここで PR をまとめると
# 同じ PR へ連続 push した時に古い commit の検査が順番待ちを作り、最新 commit の
# 結果が最も遅れる (この設定では cancel-in-progress を PR だけ true にはできない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # リリースビルドの門番。方針: cyberneura/cyberneura-github-actions の
  # docs/build-requires-tests.md
  #
  # runs-on を build と同じ macOS にしてあるのは方針のルール 4 による。lifecycle.rs の
  # シグナルハンドラや ps の出力形式は OS で変わるうえ、配布物は macOS でしか作らない。
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # ビルド用ではないので universal の 2 アーキは要らない。ホストターゲットでテストする。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # cargo test でも build.rs は走る。tauri-build は frontendDist (../build) が
      # 実在しないとアプリのコードへ到達する前に落ちるので、先にフロントを作る。
      - name: Build frontend
        run: npm run build

      - name: Type-check frontend
        run: npm run check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    # test を通らずにビルドしない。needs は同じ run の job にしか効かないので、
    # テストを別 workflow に切り出さないこと。
    needs: test
    # PR では成果物を作らない (Apple の証明書を PR のコードに触らせないためでもある)。
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel / Apple Silicon 両対応の universal バイナリを dmg で配布する。
          # 署名は下記ステップで Developer ID + 公証 (notarization)。ローカルビルドは
          # tauri.conf.json の signingIdentity "-" で ad-hoc、CI は APPLE_SIGNING_IDENTITY が
          # それを上書きする (tauri-cli の優先順位: env > config)。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # --config で beforeBuildCommand を空にし、フロントエンドのビルドを
            # tauri build から切り離す (下の "Build frontend" ステップ参照)。
            # JSON をそのまま args に書けない理由もそちらに記載。
            args: --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.ci.conf.json
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      # persist-credentials: false — checkout が write 権限の GITHUB_TOKEN を
      # .git/config に残さないようにする。以降のステップ (npm ci の install script や
      # third-party action) がそれを拾えないようにするため。
      # Apple の証明書を扱うジョブなので `uses:` は全て commit SHA に固定する
      # (tauri-action だけ固定しても、先行ステップの action が改変されれば同じ)。
      # 更新時は行末の `# v4` 等のコメントを頼りに新しい SHA を調べて置き換える。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # SHA は **master 履歴のコミット**を選ぶこと。`stable` / `1.89.0` などの
      # 生成ブランチの先端 SHA を pin すると、ブランチが進んだ時にその commit が
      # GC され、以降の run が Rust セットアップ前に落ちる (action の README の
      # "Choice of full-length commit SHA" 参照)。master SHA を pin する場合は
      # ref からツールチェインを推測できないので `toolchain` を明示する。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # フロントエンドのビルドは Secret を渡さないこのステップで済ませる。
      # tauri build に beforeBuildCommand (npm run build) を実行させると、vite と
      # その依存パッケージが APPLE_PASSWORD / GITHUB_TOKEN を持つ環境で動くことに
      # なる (子プロセスは環境変数を継承する)。悪意ある依存が 1 つ混ざるだけで
      # Apple の App用パスワードと write 権限のトークンを持ち出せてしまう。
      # 署名ビルド側は src-tauri/tauri.ci.conf.json で beforeBuildCommand を空に
      # して二重ビルドを避ける。
      # 設定を `--config {"build":{...}}` のようにインライン JSON で渡さないのは、
      # tauri-action が args を string-argv でパースしてクォートを剥がすため
      # (JSON が壊れる)。クォートを含まないファイルパスなら影響を受けない。
      - name: Build frontend (without secrets)
        run: npm run build

      # 署名・公証の Secret が 1 つでも欠けていると、tauri-action には空文字が渡るだけで
      # ビルドは通ってしまう (ad-hoc 署名や公証なしの成果物ができる)。publish ジョブは
      # 成否しか見ないため、そのまま「署名 + 公証済み」のつもりで公開される。ここで
      # 明示的に落として、配布不能な dmg が公開されるのを防ぐ。
      - name: Check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # macOS のみ: Developer ID 証明書を一時 keychain にインポートする。
      # tauri-action 自身は証明書をインポートしないため、ビルド前にこのステップで
      # 用意しておく。keychain のパスワードは使い捨てなので Secret にせず生成する。
      - name: Import Apple Developer certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # 検索リストにも入れる。codesign は default keychain ではなく検索リストから
          # identity を引くため、runner イメージの既定に依存しないよう明示する。
          security list-keychains -d user -s build.keychain
          # 検索リスト経由で Developer ID が引けることをここで確認し、駄目なら即失敗させる。
          # find-identity は identity が **0 件でも exit 0** なので、単に呼ぶだけでは
          # チェックにならない。grep で判定してビルドの奥で落ちるのを防ぐ。
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "Error: no 'Developer ID Application' identity in the keychain search list" >&2
            exit 1
          }
          rm "$RUNNER_TEMP/certificate.p12"

      # tauri.conf.json の version から v<version> タグの Release を作成し、
      # ビルド成果物をアップロードする。将来 Windows 等を matrix に足した時に、
      # 片方だけで公開状態にならないよう draft で作成し、全 leg 成功後に
      # publish ジョブで公開する。
      # 注意: 公開済みバージョンと同じ version で再実行すると、tauri-action が
      # draft 状態の不一致でエラーになる。必ず version を上げてから実行すること
      # (scripts/release.sh が採番するので、通常は `npm run release` から起動する)。
      # macOS の APPLE_* を渡すと tauri-action が Developer ID 署名 + 公証 + staple を
      # 自動で行う。Apple 認証情報を受け取るため、可変タグ @v0 ではなく commit SHA に
      # 固定する (タグが差し替えられて secrets を抜かれるサプライチェーン攻撃を防ぐ)。
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple 認証情報は macOS ジョブにのみ渡す (他プラットフォームには露出させない)。
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # package.json の "tauri" スクリプトを経由せず tauri CLI を直接叩く。
          # スクリプト側に `APPLE_SIGNING_IDENTITY='...' tauri` のようなインライン
          # 代入が入ると workflow から渡した env を上書きしてしまうため。
          # `npm exec -- tauri` は使えない — tauri-action の runner.ts は bin が
          # `npm` だと必ず `run` を先頭に挿入するため `npm run exec ...` になり、
          # "Missing script: exec" で落ちる (v0.1.1 で実測)。`npx` なら挿入されない。
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: clipboard-palette v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 全プラットフォームのビルド・アップロードが成功した時のみ draft を公開する。
  # どれかが失敗した場合は draft のまま残る (不完全な Release は公開されない)。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v${VERSION}" --draft=false --latest

  # 公開後に Homebrew tap (cyberneura/homebrew-tap) の Cask を新バージョンへ更新する。
  # queryfolio と同じ運用 (同じ tap、同じ HOMEBREW_TAP_TOKEN 名の PAT)。
  # Cask は version と sha256 を直書きするので、この更新を怠ると `brew install` が
  # 古いバージョンを配り続ける。secret 欠落時は黙ってスキップせず失敗させる
  # (Release 自体は publish 済みなので、このジョブの失敗が公開を妨げることはない)。
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 更新先は cyberneura/homebrew-tap で、書き込みは HOMEBREW_TAP_TOKEN (PAT) が行う。
    # このリポジトリの GITHUB_TOKEN には読み取りだけあればよい (release の dmg 取得)。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Missing repository secret HOMEBREW_TAP_TOKEN (PAT with contents:write on cyberneura/homebrew-tap; same one queryfolio uses). The cask was NOT updated."
            exit 1
          fi

      - name: Download released dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release download "v${VERSION}" --pattern '*_universal.dmg' --output clipboard-palette.dmg
          echo "DMG_SHA256=$(sha256sum clipboard-palette.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # binary stanza — this app is launched from a shell (reads stdin), so the
          # cask links the executable into Homebrew's bin instead of asking users
          # to symlink it manually.
          cat > clipboard-palette.rb <<EOF
          cask "clipboard-palette" do
            version "${VERSION}"
            sha256 "${DMG_SHA256}"

            url "https://github.com/ytyng/clipboard-palette/releases/download/v#{version}/clipboard-palette_#{version}_universal.dmg"
            name "Clipboard Palette"
            desc "Show copy-to-clipboard buttons for text piped from standard input"
            homepage "https://github.com/ytyng/clipboard-palette"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "clipboard-palette.app"
            binary "#{appdir}/clipboard-palette.app/Contents/MacOS/clipboard-palette"

            zap trash: [
              "~/Library/Caches/com.ytyng.clipboard-palette",
              "~/Library/Preferences/com.ytyng.clipboard-palette.plist",
              "~/Library/Saved Application State/com.ytyng.clipboard-palette.savedState",
              "~/Library/WebKit/com.ytyng.clipboard-palette",
            ]
          end
          EOF
          # gh api PUT requires the current blob sha when updating an existing file
          # (not needed on first creation).
          CURRENT_SHA=$(gh api repos/cyberneura/homebrew-tap/contents/Casks/clipboard-palette.rb -q .sha 2>/dev/null || true)
          gh api -X PUT repos/cyberneura/homebrew-tap/contents/Casks/clipboard-palette.rb \
            -f message="Update clipboard-palette cask to v${VERSION}" \
            -f content="$(base64 -w0 clipboard-palette.rb)" \
            ${CURRENT_SHA:+-f sha="$CURRENT_SHA"}
